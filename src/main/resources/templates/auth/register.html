<!DOCTYPE html>
<html lang="bg" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация | ParkNet</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-body">
<div th:replace="~{fragments/nav :: nav}"></div>

<main class="auth-shell">
    <section class="auth-hero-panel" aria-label="ParkNet">
        <span class="parknet-logo auth-logo" aria-hidden="true"></span>
        <p class="eyebrow">Нов профил</p>
        <h1>Добавяй и резервирай паркоместа в София.</h1>
        <p>Създай профил, за да публикуваш гараж, да запазваш места и да следиш заявките си.</p>
    </section>

    <section class="auth-panel">
        <p class="eyebrow">Регистрация</p>
        <h2>Създай профил</h2>

        <form th:action="@{/register}" th:object="${registerRequest}" method="post" class="stacked-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <label>
                <span>Име и фамилия</span>
                <input type="text" th:field="*{fullName}" autocomplete="name" placeholder="Иван Иванов">
                <span class="field-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></span>
            </label>
            <label>
                <span>Имейл</span>
                <input type="email" th:field="*{email}" autocomplete="email" placeholder="you@example.com">
                <span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
            </label>
            <label>
                <span>Парола</span>
                <input type="password" th:field="*{password}" autocomplete="new-password" placeholder="Минимум 6 символа">
                <span class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
            </label>
            <label>
                <span>Повтори парола</span>
                <input type="password" th:field="*{confirmPassword}" autocomplete="new-password" placeholder="Въведете паролата отново">
                <span class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></span>
            </label>
            <button type="submit">Създай профил</button>
        </form>

        <p class="form-switch">Вече имаш профил? <a th:href="@{/login}">Влез</a></p>
    </section>
</main>
</body>
</html>
