<!DOCTYPE html>
<html lang="bg" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход | ParkNet</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-body">
<div th:replace="~{fragments/nav :: nav}"></div>

<main class="auth-shell">
    <section class="auth-hero-panel" aria-label="ParkNet">
        <span class="parknet-logo auth-logo" aria-hidden="true"></span>
        <p class="eyebrow">ParkNet Sofia</p>
        <h1>Намери място близо до теб.</h1>
        <p>Влез и управлявай обяви, резервации и заявки директно върху картата.</p>
    </section>

    <section class="auth-panel">
        <p class="eyebrow">Добре дошъл обратно</p>
        <h2>Вход в профила</h2>

        <div class="alert success" th:if="${registrationSuccess}" th:text="${registrationSuccess}"></div>
        <div class="alert error" th:if="${param.error}">Невалиден имейл или парола.</div>
        <div class="alert success" th:if="${param.logout}">Излязохте успешно от профила си.</div>

        <form th:action="@{/login}" method="post" class="stacked-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <label>
                <span>Имейл</span>
                <input type="email" name="email" autocomplete="email" placeholder="you@example.com" required>
            </label>
            <label>
                <span>Парола</span>
                <input type="password" name="password" autocomplete="current-password" placeholder="Вашата парола" required>
            </label>
            <button type="submit">Вход</button>
        </form>

        <p class="form-switch">Нямаш профил? <a th:href="@{/register}">Регистрирай се</a></p>
    </section>
</main>
</body>
</html>
